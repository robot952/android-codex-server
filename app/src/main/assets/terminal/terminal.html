<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:">
    <link rel="stylesheet" href="xterm.min.css">
    <style>
        * { box-sizing: border-box; }
        html, body, #terminal {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }
        body { touch-action: none; }
        .xterm { height: 100%; padding: 4px 3px 2px; }
        .xterm-viewport {
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch !important;
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <script src="xterm.min.js"></script>
    <script src="xterm-addon-fit.min.js"></script>
    <script src="terminal-bridge.js"></script>
</body>
</html>
