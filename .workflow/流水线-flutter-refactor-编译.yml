version: "1.0"
name: Flutter Refactor 发布
displayName: 版本标签发布
stages:
- name: flutter_refactor_build
  displayName: 版本标签 Android 发布
  strategy: naturally
  trigger: auto
  steps:
  - step: build@android
    name: flutter_refactor_android_build
    displayName: Flutter Android Release
    jdkVersion: "17"
    gradleVersion: "9.1"
    buildToolsVersion: "36.0.0"
    ndkVersion: 28.2.13676358
    commands:
    - bash scripts/run-gitee-release.sh
    artifacts:
    - name: FLUTTER_REFACTOR_BUILD_ARTIFACT
      path:
      - dist
      type: .tar.gz
    # Upload only dist artifacts. Whole SDK/Gradle caches caused HTTP 413 and
    # prevented artifact publication after a successful build. In-job caches
    # and Gitee's preinstalled SDK reuse remain enabled in the build scripts.
    caches: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
triggers:
  trigger: auto
  push:
    tags:
      prefix:
      - v
      precise: []
      include: []
notify: []
strategy:
  blocking: true
variables:
  global:
  - CODEX_RELEASE_TOKEN
