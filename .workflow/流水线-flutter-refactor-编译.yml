version: "1.0"
name: Flutter Refactor 发布
displayName: Flutter Refactor 发布
stages:
- name: flutter_refactor_build
  displayName: Flutter Refactor Android 发布
  strategy: naturally
  trigger: auto
  steps:
  - step: build@android
    name: flutter_refactor_android_build
    displayName: Flutter Android Release
    jdkVersion: "17"
    gradleVersion: "9.1"
    buildToolsVersion: "36.0.0"
    ndkVersion: 28.2.13676358
    commands:
    - bash scripts/publish-tag-release.sh
    artifacts:
    - name: FLUTTER_REFACTOR_BUILD_ARTIFACT
      path:
      - dist
      type: .tar.gz
    caches:
    - "~/.cache/codex/flutter-3.44.8"
    - "~/.cache/codex/android-sdk"
    - "~/.pub-cache"
    - "~/.gradle/caches"
    - "~/.gradle/wrapper"
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
triggers:
  trigger: auto
  push:
    tags:
      prefix:
      - v
      precise: []
      include: []
notify: []
strategy:
  blocking: true
variables:
  global:
  - CODEX_RELEASE_TOKEN
