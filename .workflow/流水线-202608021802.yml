version: "1.0"
name: 构建
displayName: 构建
stages:
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@android
    name: android_build
    displayName: Android 构建
    jdkVersion: "17"
    gradleVersion: "8.12"
    buildToolsVersion: 34.0.0
    ndkVersion: 28.2.13676358
    commands:
    - GRADLE_USER_HOME="$HOME/.gradle" CODEX_BUILD_ONLINE=1 ./scripts/build-android.sh
      release
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - app/build/outputs/apk/release
      type: .tar.gz
    caches:
    - "~/.gradle"
    strategy:
      retry: "0"
      resource:
        cpu: "8"
        memory: "16"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true
