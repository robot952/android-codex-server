version: "1.0"
name: 构建
displayName: 构建
stages:
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@android
    name: android_build
    displayName: Android 构建
    jdkVersion: "17"
    gradleVersion: "8.12"
    buildToolsVersion: 34.0.0
    ndkVersion: 28.2.13676358
    commands:
    - GRADLE_USER_HOME="$HOME/.gradle" CODEX_BUILD_ONLINE=1
      GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
      -Dorg.gradle.workers.max=4" ./scripts/publish-gitee-release.sh
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - dist
      type: .tar.gz
    caches:
    - "~/.gradle/caches"
    - "~/.gradle/wrapper"
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
triggers:
  trigger: auto
  push:
    branches:
      prefix: []
      precise:
      - release
      include: []
notify: []
strategy:
  blocking: true
variables:
  global:
  - CODEX_RELEASE_TOKEN
