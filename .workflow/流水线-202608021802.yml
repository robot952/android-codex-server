version: "1.0"
name: 构建
displayName: 构建
stages:
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@android
    name: android_build
    displayName: Android 构建
    jdkVersion: "17"
    gradleVersion: "9.1"
    buildToolsVersion: "36.0.0"
    ndkVersion: 28.2.13676358
    commands:
    - bash scripts/build-gitee-release.sh release
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - dist
      type: .tar.gz
    caches:
    - "~/.cache/codex/flutter-3.44.8"
    - "~/.pub-cache"
    - "~/.gradle/caches"
    - "~/.gradle/wrapper"
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
triggers:
  trigger: auto
  push:
    branches:
      prefix: []
      precise:
      - release
      include: []
notify: []
strategy:
  blocking: true
variables:
  global:
  - CODEX_RELEASE_TOKEN
