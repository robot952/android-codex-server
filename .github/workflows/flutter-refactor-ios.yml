name: Flutter Refactor Mobile Release

on:
  push:
    branches:
      - flutter-refactor
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-refactor-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-compile:
    name: iOS unsigned compile
    runs-on: macos-14
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Check Apple toolchain
        run: |
          xcodebuild -version
          flutter --version
          flutter doctor --verbose

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Build unsigned iOS archive
        run: flutter build ipa --release --no-codesign --no-pub

      - name: Package certificate-free IPA
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml | head -n 1)"
          archive="build/ios/archive/Runner.xcarchive"
          archive_app="$archive/Products/Applications/Runner.app"
          package_root="build/ios/unsigned-package"
          ipa_dir="build/ios/ipa"
          test -n "$version"
          test -d "$archive_app"

          rm -rf "$package_root"
          mkdir -p "$package_root/Payload" "$ipa_dir" build/ios/metadata
          ditto "$archive_app" "$package_root/Payload/Runner.app"

          # Ad-hoc signing adds no Apple certificate. AppSync/TrollStore or an
          # equivalent bypass is still required on the target device.
          codesign --force --deep --sign - --timestamp=none \
            "$package_root/Payload/Runner.app"
          codesign --verify --deep --strict "$package_root/Payload/Runner.app"

          ipa_name="Agent-flutter-refactor-${version%%+*}-unsigned.ipa"
          ipa_path="$(pwd)/$ipa_dir/$ipa_name"
          (
            cd "$package_root"
            /usr/bin/zip -qry "$ipa_path" Payload
          )
          test -s "$ipa_path"
          ipa_sha256="$(shasum -a 256 "$ipa_path" | awk '{print $1}')"
          {
            printf 'sourceBranch=flutter-refactor\n'
            printf 'gitCommit=%s\n' "${GITHUB_SHA}"
            printf 'version=%s\n' "$version"
            printf 'codesign=adhoc-no-apple-certificate\n'
            printf 'ipa=%s\n' "$ipa_name"
            printf 'ipaSha256=%s\n' "$ipa_sha256"
            printf 'requiresJailbreakBypass=true\n'
          } > build/ios/metadata/flutter-refactor-ios-build.txt
          ls -lh "$ipa_path" build/ios/metadata/flutter-refactor-ios-build.txt

      - name: Upload certificate-free IPA
        uses: actions/upload-artifact@v4
        with:
          name: codex-remote-ios-unsigned-${{ github.sha }}
          if-no-files-found: error
          path: |
            flutter_app/build/ios/ipa/*.ipa
            flutter_app/build/ios/metadata/flutter-refactor-ios-build.txt

  android-compile:
    name: Android release compile
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android release APK
        run: flutter build apk --release --no-pub

      - name: Package Android release APK
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml | head -n 1)"
          source_apk="build/app/outputs/flutter-apk/app-release.apk"
          output_dir="dist/android"
          apk_name="Agent-flutter-refactor-${version%%+*}.apk"
          test -n "$version"
          test -s "$source_apk"

          mkdir -p "$output_dir"
          install -m 0644 "$source_apk" "$output_dir/$apk_name"
          apk_sha256="$(sha256sum "$output_dir/$apk_name" | awk '{print $1}')"
          {
            printf 'sourceBranch=flutter-refactor\n'
            printf 'gitCommit=%s\n' "${GITHUB_SHA}"
            printf 'version=%s\n' "$version"
            printf 'apk=%s\n' "$apk_name"
            printf 'apkSha256=%s\n' "$apk_sha256"
          } > "$output_dir/flutter-refactor-android-build.txt"
          ls -lh "$output_dir"

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: codex-remote-android-${{ github.sha }}
          if-no-files-found: error
          path: flutter_app/dist/android

  publish-release:
    name: Publish mobile prerelease
    needs:
      - ios-compile
      - android-compile
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: codex-remote-ios-unsigned-${{ github.sha }}
          path: release-assets/ios

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: codex-remote-android-${{ github.sha }}
          path: release-assets/android

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' flutter_app/pubspec.yaml | head -n 1)"
          release_version="${version%%+*}"
          short_sha="${GITHUB_SHA:0:7}"
          tag="flutter-refactor-v${release_version}-${short_sha}"
          title="Flutter refactor v${release_version} (${short_sha})"
          notes_file="release-assets/flutter-refactor-release.md"
          mapfile -t assets < <(
            find release-assets -type f \
              \( -name '*.ipa' -o -name '*.apk' -o -name '*-build.txt' \) \
              -print | sort
          )
          test "${#assets[@]}" -eq 4

          {
            printf 'Mobile builds from `flutter-refactor`.\n\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Android: signed Release APK for standard Android devices\n'
            printf -- '- iOS: ad-hoc signed IPA without an Apple Developer certificate\n'
            printf -- '- iOS installation requires AppSync, TrollStore, or an equivalent bypass\n'
          } > "$notes_file"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$notes_file" \
              --prerelease
          fi
