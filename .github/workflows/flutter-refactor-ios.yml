name: Flutter Refactor Cross-platform Release

on:
  push:
    branches:
      - flutter-refactor
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-refactor-cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-compile:
    name: iOS unsigned compile
    runs-on: macos-14
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Check Apple toolchain
        run: |
          xcodebuild -version
          flutter --version
          flutter doctor --verbose

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Build unsigned iOS archive
        run: flutter build ipa --release --no-codesign --no-pub

      - name: Package certificate-free IPA variants
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml | head -n 1)"
          archive="build/ios/archive/Runner.xcarchive"
          archive_app="$archive/Products/Applications/Runner.app"
          package_root="build/ios/unsigned-package"
          sideload_root="build/ios/sideload-package"
          ipa_dir="build/ios/ipa"
          test -n "$version"
          test -d "$archive_app"

          rm -rf "$package_root" "$sideload_root"
          mkdir -p \
            "$package_root/Payload" \
            "$sideload_root/Payload" \
            "$ipa_dir" \
            build/ios/metadata

          # Sideloadly must apply its own Apple ID certificate and provisioning
          # profile. Supply a clean app bundle without ad-hoc signature data.
          sideload_app="$sideload_root/Payload/Runner.app"
          ditto "$archive_app" "$sideload_app"
          find "$sideload_app" -type d -name _CodeSignature -prune \
            -exec rm -rf {} +
          find "$sideload_app" -type f -name embedded.mobileprovision -delete
          while IFS= read -r -d '' candidate; do
            if /usr/bin/file "$candidate" | grep -q 'Mach-O'; then
              chmod 755 "$candidate"
            fi
          done < <(find "$sideload_app" -type f -print0)

          sideload_name="Agent-flutter-refactor-${version%%+*}-sideload-ready.ipa"
          sideload_path="$(pwd)/$ipa_dir/$sideload_name"
          (
            cd "$sideload_root"
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
              Payload "$sideload_path"
          )
          test -s "$sideload_path"
          /usr/bin/unzip -tq "$sideload_path"
          sideload_entries="$(/usr/bin/unzip -Z1 "$sideload_path")"
          printf '%s\n' "$sideload_entries" | \
            grep -qx 'Payload/Runner.app/Runner'
          if printf '%s\n' "$sideload_entries" | \
            grep -Eq '/_CodeSignature/|/embedded\.mobileprovision$'; then
            echo "Sideload IPA still contains signing data" >&2
            exit 1
          fi
          sideload_sha256="$(shasum -a 256 "$sideload_path" | awk '{print $1}')"

          # The ad-hoc variant is separate and remains intended only for
          # AppSync, TrollStore, or an equivalent signature bypass.
          ditto "$archive_app" "$package_root/Payload/Runner.app"
          codesign --force --deep --sign - --timestamp=none \
            "$package_root/Payload/Runner.app"
          codesign --verify --deep --strict "$package_root/Payload/Runner.app"

          ipa_name="Agent-flutter-refactor-${version%%+*}-unsigned.ipa"
          ipa_path="$(pwd)/$ipa_dir/$ipa_name"
          (
            cd "$package_root"
            /usr/bin/zip -qry "$ipa_path" Payload
          )
          test -s "$ipa_path"
          ipa_sha256="$(shasum -a 256 "$ipa_path" | awk '{print $1}')"
          {
            printf 'sourceBranch=flutter-refactor\n'
            printf 'gitCommit=%s\n' "${GITHUB_SHA}"
            printf 'version=%s\n' "$version"
            printf 'codesign=adhoc-no-apple-certificate\n'
            printf 'ipa=%s\n' "$ipa_name"
            printf 'ipaSha256=%s\n' "$ipa_sha256"
            printf 'requiresJailbreakBypass=true\n'
            printf 'sideloadIpa=%s\n' "$sideload_name"
            printf 'sideloadIpaSha256=%s\n' "$sideload_sha256"
            printf 'sideloadRequiresAppleIdSigning=true\n'
          } > build/ios/metadata/flutter-refactor-ios-build.txt
          ls -lh \
            "$ipa_path" \
            "$sideload_path" \
            build/ios/metadata/flutter-refactor-ios-build.txt

      - name: Upload certificate-free IPA
        uses: actions/upload-artifact@v4
        with:
          name: codex-remote-ios-unsigned-${{ github.sha }}
          if-no-files-found: error
          path: |
            flutter_app/build/ios/ipa/*.ipa
            flutter_app/build/ios/metadata/flutter-refactor-ios-build.txt

  android-compile:
    name: Android release compile
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android release APK
        run: flutter build apk --release --no-pub

      - name: Package Android release APK
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml | head -n 1)"
          source_apk="build/app/outputs/flutter-apk/app-release.apk"
          output_dir="dist/android"
          apk_name="Agent-flutter-refactor-${version%%+*}.apk"
          test -n "$version"
          test -s "$source_apk"

          mkdir -p "$output_dir"
          install -m 0644 "$source_apk" "$output_dir/$apk_name"
          apk_sha256="$(sha256sum "$output_dir/$apk_name" | awk '{print $1}')"
          {
            printf 'sourceBranch=flutter-refactor\n'
            printf 'gitCommit=%s\n' "${GITHUB_SHA}"
            printf 'version=%s\n' "$version"
            printf 'apk=%s\n' "$apk_name"
            printf 'apkSha256=%s\n' "$apk_sha256"
          } > "$output_dir/flutter-refactor-android-build.txt"
          ls -lh "$output_dir"

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: codex-remote-android-${{ github.sha }}
          if-no-files-found: error
          path: flutter_app/dist/android

  windows-compile:
    name: Windows x64 release compile
    runs-on: windows-2022
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Prepare Windows runner
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --org top.asdb --project-name codex_remote .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows x64 release
        run: flutter build windows --release --no-pub

      - name: Package Windows x64 release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $versionMatch = Select-String -Path "pubspec.yaml" -Pattern '^version:\s*(\S+)' |
            Select-Object -First 1
          if (-not $versionMatch) { throw "Version was not found in pubspec.yaml" }
          $version = $versionMatch.Matches[0].Groups[1].Value
          $releaseVersion = $version.Split('+')[0]
          $sourceDir = "build\windows\x64\runner\Release"
          $outputDir = "dist\windows"
          $packageName = "Agent-flutter-refactor-$releaseVersion-windows-x64"
          $packageDir = Join-Path $outputDir $packageName
          $zipPath = "$packageDir.zip"
          $executable = Join-Path $sourceDir "codex_remote.exe"
          if (-not (Test-Path $executable -PathType Leaf)) {
            throw "Windows executable was not produced: $executable"
          }

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -Path (Join-Path $sourceDir '*') -Destination $packageDir -Recurse -Force
          Compress-Archive -Path $packageDir -DestinationPath $zipPath -CompressionLevel Optimal
          if (-not (Test-Path $zipPath -PathType Leaf)) {
            throw "Windows archive was not produced: $zipPath"
          }
          $zipSha256 = (Get-FileHash -Algorithm SHA256 -Path $zipPath).Hash.ToLowerInvariant()
          @(
            "sourceBranch=flutter-refactor"
            "gitCommit=$env:GITHUB_SHA"
            "version=$version"
            "architecture=x64"
            "archive=$packageName.zip"
            "archiveSha256=$zipSha256"
            "codesign=disabled"
          ) | Set-Content -Path (Join-Path $outputDir "flutter-refactor-windows-build.txt") -Encoding ascii
          Get-ChildItem $outputDir | Format-Table Name, Length

      - name: Build Windows x64 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $versionMatch = Select-String -Path "pubspec.yaml" -Pattern '^version:\s*(\S+)' |
            Select-Object -First 1
          if (-not $versionMatch) { throw "Version was not found in pubspec.yaml" }
          $releaseVersion = $versionMatch.Matches[0].Groups[1].Value.Split('+')[0]
          $outputDir = (Resolve-Path "dist\windows").Path
          $packageName = "Agent-flutter-refactor-$releaseVersion-windows-x64"
          $packageDir = (Resolve-Path (Join-Path $outputDir $packageName)).Path
          $installerName = "$packageName-setup"
          $installerPath = Join-Path $outputDir "$installerName.exe"
          $iconPath = (Resolve-Path "windows\runner\resources\app_icon.ico").Path

          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $isccPath = $isccCandidates |
            Where-Object { Test-Path $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $isccPath) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey failed to install Inno Setup"
            }
            $isccPath = $isccCandidates |
              Where-Object { Test-Path $_ -PathType Leaf } |
              Select-Object -First 1
          }
          if (-not $isccPath) { throw "Inno Setup compiler was not found" }

          $installerScript = @"
          [Setup]
          AppId=top.asdb.agent.windows
          AppName=Codex Remote
          AppVersion=$releaseVersion
          AppPublisher=robot952
          DefaultDirName={localappdata}\Programs\Codex Remote
          DefaultGroupName=Codex Remote
          DisableProgramGroupPage=yes
          OutputDir=$outputDir
          OutputBaseFilename=$installerName
          SetupIconFile=$iconPath
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          UninstallDisplayIcon={app}\codex_remote.exe
          CloseApplications=yes

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"; Flags: unchecked

          [Files]
          Source: "$packageDir\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\Codex Remote"; Filename: "{app}\codex_remote.exe"
          Name: "{autodesktop}\Codex Remote"; Filename: "{app}\codex_remote.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\codex_remote.exe"; Description: "Launch Codex Remote"; Flags: nowait postinstall skipifsilent
          "@
          $issPath = Join-Path $env:RUNNER_TEMP "codex-remote-installer.iss"
          $installerScript | Set-Content -Path $issPath -Encoding ascii
          & $isccPath $issPath
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          if (-not (Test-Path $installerPath -PathType Leaf)) {
            throw "Windows installer was not produced: $installerPath"
          }

          $installerSha256 = (Get-FileHash -Algorithm SHA256 -Path $installerPath).Hash.ToLowerInvariant()
          @(
            "installer=$installerName.exe"
            "installerSha256=$installerSha256"
          ) | Add-Content -Path (Join-Path $outputDir "flutter-refactor-windows-build.txt") -Encoding ascii
          Get-ChildItem $outputDir -File | Format-Table Name, Length

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: codex-remote-windows-x64-${{ github.sha }}
          if-no-files-found: error
          path: |
            flutter_app/dist/windows/*.exe
            flutter_app/dist/windows/*.zip
            flutter_app/dist/windows/flutter-refactor-windows-build.txt

  publish-release:
    name: Publish cross-platform prerelease
    needs:
      - ios-compile
      - android-compile
      - windows-compile
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: codex-remote-ios-unsigned-${{ github.sha }}
          path: release-assets/ios

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: codex-remote-android-${{ github.sha }}
          path: release-assets/android

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: codex-remote-windows-x64-${{ github.sha }}
          path: release-assets/windows

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' flutter_app/pubspec.yaml | head -n 1)"
          release_version="${version%%+*}"
          short_sha="${GITHUB_SHA:0:7}"
          tag="flutter-refactor-v${release_version}-${short_sha}"
          title="Flutter refactor v${release_version} (${short_sha})"
          notes_file="release-assets/flutter-refactor-release.md"
          mapfile -t assets < <(
            find release-assets -type f \
              \( -name '*.ipa' -o -name '*.apk' -o -name '*.exe' -o -name '*.zip' -o -name '*-build.txt' \) \
              -print | sort
          )
          test "${#assets[@]}" -eq 8

          {
            printf 'Cross-platform builds from `flutter-refactor`.\n\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Android: signed Release APK for standard Android devices\n'
            printf -- '- iOS AppSync/TrollStore: ad-hoc signed unsigned IPA\n'
            printf -- '- iOS Sideloadly: clean IPA requiring local Apple ID re-signing\n'
            printf -- '- Windows x64: unsigned setup EXE and portable ZIP\n'
          } > "$notes_file"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$notes_file" \
              --prerelease
          fi
