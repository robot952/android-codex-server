name: Flutter Refactor iOS Compile

on:
  push:
    branches:
      - flutter-refactor
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-refactor-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-compile:
    name: iOS unsigned compile
    runs-on: macos-14
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Check Apple toolchain
        run: |
          xcodebuild -version
          flutter --version
          flutter doctor --verbose

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Build unsigned iOS archive
        run: flutter build ipa --release --no-codesign --no-pub

      - name: Package certificate-free IPA
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml | head -n 1)"
          archive="build/ios/archive/Runner.xcarchive"
          archive_app="$archive/Products/Applications/Runner.app"
          package_root="build/ios/unsigned-package"
          ipa_dir="build/ios/ipa"
          test -n "$version"
          test -d "$archive_app"

          rm -rf "$package_root"
          mkdir -p "$package_root/Payload" "$ipa_dir" build/ios/metadata
          ditto "$archive_app" "$package_root/Payload/Runner.app"

          # Ad-hoc signing adds no Apple certificate. AppSync/TrollStore or an
          # equivalent bypass is still required on the target device.
          codesign --force --deep --sign - --timestamp=none \
            "$package_root/Payload/Runner.app"
          codesign --verify --deep --strict "$package_root/Payload/Runner.app"

          ipa_name="Agent-flutter-refactor-${version%%+*}-unsigned.ipa"
          ipa_path="$(pwd)/$ipa_dir/$ipa_name"
          (
            cd "$package_root"
            /usr/bin/zip -qry "$ipa_path" Payload
          )
          test -s "$ipa_path"
          ipa_sha256="$(shasum -a 256 "$ipa_path" | awk '{print $1}')"
          {
            printf 'sourceBranch=flutter-refactor\n'
            printf 'gitCommit=%s\n' "${GITHUB_SHA}"
            printf 'version=%s\n' "$version"
            printf 'codesign=adhoc-no-apple-certificate\n'
            printf 'ipa=%s\n' "$ipa_name"
            printf 'ipaSha256=%s\n' "$ipa_sha256"
            printf 'requiresJailbreakBypass=true\n'
          } > build/ios/metadata/flutter-refactor-ios-build.txt
          ls -lh "$ipa_path" build/ios/metadata/flutter-refactor-ios-build.txt

      - name: Upload certificate-free IPA
        uses: actions/upload-artifact@v4
        with:
          name: codex-remote-ios-unsigned-${{ github.sha }}
          if-no-files-found: error
          path: |
            flutter_app/build/ios/ipa/*.ipa
            flutter_app/build/ios/metadata/flutter-refactor-ios-build.txt

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml | head -n 1)"
          release_version="${version%%+*}"
          short_sha="${GITHUB_SHA:0:7}"
          tag="flutter-refactor-ios-v${release_version}-${short_sha}"
          title="iOS unsigned v${release_version} (${short_sha})"
          notes_file="build/ios/metadata/flutter-refactor-ios-release.md"
          assets=(
            build/ios/ipa/*.ipa
            build/ios/metadata/flutter-refactor-ios-build.txt
          )

          {
            printf 'Certificate-free iOS build from `flutter-refactor`.\n\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Signing: ad-hoc, no Apple Developer certificate\n'
            printf -- '- Installation: requires AppSync, TrollStore, or an equivalent bypass\n'
            printf -- '- Standard non-jailbroken iPhones are not supported\n'
          } > "$notes_file"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$notes_file" \
              --prerelease
          fi
